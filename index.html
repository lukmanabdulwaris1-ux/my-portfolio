<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Button</title>
<style>
:root{
  --bg:#e8eaee; --bg2:#f7f8fa; --ink:#14161a; --muted:#6b7078;
  --glass-a:rgba(255,255,255,.75); --glass-b:rgba(255,255,255,.18);
  --edge:rgba(255,255,255,.9); --slab:rgba(150,158,172,.35);
  --shadow:rgba(40,48,64,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0e; --bg2:#1d1e24; --ink:#f2f3f5; --muted:#8b909a;
    --glass-a:rgba(255,255,255,.16); --glass-b:rgba(255,255,255,.03);
    --edge:rgba(255,255,255,.4); --slab:rgba(0,0,0,.55);
    --shadow:rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0e; --bg2:#1d1e24; --ink:#f2f3f5; --muted:#8b909a;
  --glass-a:rgba(255,255,255,.16); --glass-b:rgba(255,255,255,.03);
  --edge:rgba(255,255,255,.4); --slab:rgba(0,0,0,.55);
  --shadow:rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 30%,var(--bg2),var(--bg));
  color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;transition:background .5s,color .5s;
}
h1{font-size:1.15rem;font-weight:600;margin:0 0 .25rem;letter-spacing:.01em}
p.hint{margin:0;color:var(--muted);font-size:.9rem}
header{text-align:center;position:absolute;top:calc(env(safe-area-inset-top,0px) + 28px)}

.scene{perspective:1100px;width:100%;display:flex;justify-content:center}
.stack{
  --w:min(300px,70vw); --h:calc(var(--w)*.29);
  display:flex;flex-direction:column;gap:calc(var(--h)*.42);
  transform-style:preserve-3d;
  transform:rotateX(58deg) rotateZ(-38deg);
}
.pill{
  --glow:#5b8cff; --mx:50%; --my:50%;
  position:relative;width:var(--w);height:var(--h);border-radius:999px;
  border:1px solid var(--edge);
  background:
    radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 45%),
    linear-gradient(135deg,var(--glass-a),var(--glass-b));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 2px 2px var(--edge), inset 0 -10px 18px color-mix(in srgb,var(--glow) 0%,transparent);
  color:var(--ink);font:inherit;font-weight:500;font-size:calc(var(--w)*.062);
  display:flex;align-items:center;gap:1em;padding:0 calc(var(--h)*.38);
  cursor:pointer;transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .45s,background .45s;
  -webkit-tap-highlight-color:transparent;
}
/* slab underneath = glass thickness + cast shadow */
.pill::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--slab);transform:translateZ(-16px);
  box-shadow:0 30px 40px -6px var(--shadow);
  transition:box-shadow .45s,background .45s;z-index:-1;
}
/* inner glow */
.pill::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 140% at 20% 110%,var(--glow),transparent 62%);
  opacity:0;transition:opacity .45s;mix-blend-mode:normal;
}
.pill:hover{transform:translateZ(10px)}
.pill:hover::after{opacity:.4}
.pill[aria-pressed="true"]{transform:translateZ(-4px)}
.pill[aria-pressed="true"]::after{opacity:.95}
.pill[aria-pressed="true"]::before{
  background:color-mix(in srgb,var(--glow) 38%,var(--slab));
  box-shadow:0 26px 46px -6px color-mix(in srgb,var(--glow) 70%,transparent);
}
.pill[aria-pressed="true"]{
  box-shadow:inset 0 2px 2px var(--edge), inset 0 -14px 24px color-mix(in srgb,var(--glow) 55%,transparent);
  color:#fff;
}
.pill:focus-visible{outline:2px solid var(--glow);outline-offset:6px}
.pill svg{width:1.5em;height:1.5em;flex:none;position:relative;z-index:1}
.pill .label{flex:1;text-align:left;position:relative;z-index:1}
.dots{display:flex;gap:.22em;position:relative;z-index:1}
.dots i{width:.28em;height:.28em;border-radius:50%;background:currentColor;opacity:.7}

.theme{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  border:1px solid var(--edge);background:var(--glass-b);color:var(--ink);
  font:inherit;font-size:.9rem;padding:.6rem 1.1rem;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.theme:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Liquid button</h1>
  <p class="hint">Hover to light one up, tap to select it.</p>
</header>

<div class="scene">
  <div class="stack" role="group" aria-label="Focus modes">
    <button class="pill" style="--glow:#4d7dff" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/></svg>
      <span class="label">Sleep</span><span class="dots"><i></i><i></i><i></i></span>
    </button>
    <button class="pill" style="--glow:#ff3b3b" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      <span class="label">Do Not Disturb</span><span class="dots"><i></i><i></i><i></i></span>
    </button>
    <button class="pill" style="--glow:#2fd6a1" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0Z"/></svg>
      <span class="label">Personal</span><span class="dots"><i></i><i></i><i></i></span>
    </button>
  </div>
</div>

<button class="theme" id="theme" type="button">Switch to dark</button>

<script>
(function(){
  var pills=document.querySelectorAll('.pill');
  pills.forEach(function(p){
    p.addEventListener('click',function(){
      pills.forEach(function(o){o.setAttribute('aria-pressed',o===p?'true':'false')});
    });
    p.addEventListener('pointermove',function(e){
      var r=p.getBoundingClientRect();
      p.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      p.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    });
  });
  var root=document.documentElement,btn=document.getElementById('theme');
  function isDark(){
    var t=root.getAttribute('data-theme');
    return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function label(){btn.textContent=isDark()?'Switch to light':'Switch to dark'}
  btn.addEventListener('click',function(){
    root.setAttribute('data-theme',isDark()?'light':'dark');label();
  });
  label();
})();
</script>
<script src="script.js"></script>
</body>
</html>
